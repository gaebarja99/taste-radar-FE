<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taste Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="/assets/css/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="/assets/css/index.css" />
    <link rel="stylesheet" href="/assets/css/customer-drawer.css" />
    <link rel="stylesheet" href="/assets/css/customer-buttons.css" />
    <link rel="stylesheet" href="/assets/css/notification-dropdown.css" />
    <link rel="stylesheet" href="/assets/css/kakao-auth.css" />
    <link rel="stylesheet" href="/assets/css/review-pages.css" />
    <script type="module" src="/src/load-kakao-map.js"></script>
    <script src="/assets/js/kakao-brand.js" defer></script>
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/auth-shared.js" defer></script>
    <script src="/assets/js/customer-notifications.js" defer></script>
    <script src="/assets/js/customer-menu.js" defer></script>
    <script src="/assets/js/review-shared.js" defer></script>
    <script src="/assets/js/index.js" defer></script>
  </head>
  <body>
    <header class="site-header" aria-label="상단">
      <div class="site-header-inner">
        <a class="brand" href="./index.html">Taste Radar</a>

        <form id="searchForm" class="search-form" role="search">
          <i class="ti ti-search" aria-hidden="true"></i>
          <label for="searchInput" class="visually-hidden">가게 또는 메뉴 검색</label>
          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="내 입맛에 딱 맞는 맛집 찾기, 지금 내 레이더에 걸린 메뉴는?"
            autocomplete="off"
          />
          <button type="submit" class="search-submit">검색</button>
        </form>

        <div class="header-actions">
          <button
            id="btnKakaoLogin"
            type="button"
            class="btn-kakao btn-kakao--subtle"
            aria-label="카카오 로그인"
            aria-haspopup="dialog"
            hidden
          >
            <svg class="kakao-logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M12 3c5.523 0 10 3.582 10 8 0 2.558-1.294 4.832-3.333 6.274L19 22l-5.2-2.86C14.89 19.378 13.47 19.5 12 19.5 6.477 19.5 2 15.918 2 11.5 2 7.082 6.477 3.5 12 3.5z"/>
            </svg>
            <span>카카오 로그인</span>
          </button>
          <div id="userMenu" class="user-menu" hidden>
            <span class="user-nickname" id="userNickname"></span>
            <button type="button" id="btnLogout" class="btn-ghost-sm">로그아웃</button>
          </div>
          <button
            id="btnCart"
            type="button"
            class="icon-btn"
            aria-label="장바구니 열기"
            aria-haspopup="dialog"
            aria-controls="cartDrawer"
          >
            <i class="ti ti-shopping-cart" aria-hidden="true"></i>
            <span id="cartBadge" class="icon-badge" hidden>0</span>
          </button>
          <button
            id="btnMenu"
            type="button"
            class="icon-btn"
            aria-label="메뉴 열기"
            aria-haspopup="dialog"
            aria-controls="menuDrawer"
          >
            <i class="ti ti-menu-2" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </header>

    <aside
      id="cartDrawer"
      class="side-drawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="cartDrawerTitle"
      aria-hidden="true"
      hidden
    >
      <div class="drawer-backdrop" data-drawer-close></div>
      <div class="drawer-panel">
        <header class="drawer-head">
          <h2 id="cartDrawerTitle" class="drawer-title">장바구니</h2>
          <button
            type="button"
            class="drawer-close"
            data-drawer-close
            aria-label="닫기"
          >
            <i class="ti ti-x" aria-hidden="true"></i>
          </button>
        </header>
        <div class="drawer-subhead">
          <span id="cartStoreName" class="cart-store-name">—</span>
          <span id="cartItemCount" class="cart-count-pill">0개</span>
        </div>
        <div id="cartBody" class="drawer-body" aria-live="polite">
          <p class="drawer-empty">불러오는 중…</p>
        </div>
        <footer class="drawer-foot">
          <div class="cart-total-row">
            <span>합계</span>
            <strong id="cartTotal">0원</strong>
          </div>
          <div class="cart-actions">
            <button
              type="button"
              id="btnCartClear"
              class="btn-outline"
              disabled
            >
              비우기
            </button>
            <button
              type="button"
              id="btnCartCheckout"
              class="btn-primary"
              disabled
            >
              주문하기
            </button>
          </div>
        </footer>
      </div>
    </aside>

    <aside
      id="menuDrawer"
      class="side-drawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="menuDrawerTitle"
      aria-hidden="true"
      hidden
    >
      <div class="drawer-backdrop" data-drawer-close></div>
      <div class="drawer-panel">
        <header class="drawer-head">
          <h2 id="menuDrawerTitle" class="drawer-title">메뉴</h2>
          <button
            type="button"
            class="drawer-close"
            data-drawer-close
            aria-label="닫기"
          >
            <i class="ti ti-x" aria-hidden="true"></i>
          </button>
        </header>
        <div id="menuDrawerGuest" class="drawer-guest" hidden>
          <div class="drawer-guest-card">
            <div class="drawer-guest-top">
              <div class="drawer-guest-avatar" aria-hidden="true">
                <i class="ti ti-user"></i>
              </div>
              <div class="drawer-guest-copy">
                <strong class="drawer-guest-title">로그인하고 주문해 보세요</strong>
                <p class="drawer-guest-lead">카카오 계정으로 3초 만에 시작</p>
              </div>
            </div>
            <button type="button" id="menuDrawerKakaoStart" class="drawer-kakao-start">
              <svg class="kakao-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3c5.523 0 10 3.582 10 8 0 2.558-1.294 4.832-3.333 6.274L19 22l-5.2-2.86C14.89 19.378 13.47 19.5 12 19.5 6.477 19.5 2 15.918 2 11.5 2 7.082 6.477 3.5 12 3.5z"/></svg>
              카카오로 시작하기
            </button>
          </div>
        </div>
        <a id="menuDrawerUser" class="drawer-user drawer-user-link" href="/pages/my-profile.html" hidden>
          <span class="drawer-user-avatar" aria-hidden="true">
            <i class="ti ti-user"></i>
          </span>
          <div class="drawer-user-text">
            <strong id="menuDrawerNickname">회원</strong>
          </div>
          <i class="ti ti-chevron-right drawer-user-chevron" aria-hidden="true"></i>
        </a>
        <nav class="drawer-body">
          <ul id="menuDrawerList" class="drawer-list"></ul>
        </nav>
        <footer id="menuDrawerFoot" class="drawer-foot" hidden></footer>
      </div>
    </aside>

    <div
      id="roleModal"
      class="modal-backdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="roleModalTitle"
      hidden
    >
      <div class="modal-card role-modal-card">
        <button
          type="button"
          id="roleModalClose"
          class="modal-close"
          aria-label="닫기"
        >
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
        <header class="role-modal-head">
          <h2 id="roleModalTitle" class="role-modal-title">Taste Radar 시작하기</h2>
          <p class="role-modal-subtitle">역할을 선택하고 로그인하세요</p>
        </header>
        <div class="role-picker" role="tablist" aria-label="로그인 역할">
          <button
            type="button"
            class="role-picker-btn is-active"
            data-role="CUSTOMER"
            role="tab"
            aria-selected="true"
          >
            <i class="ti ti-shopping-bag" aria-hidden="true"></i>
            <span>고객</span>
          </button>
          <button
            type="button"
            class="role-picker-btn"
            data-role="OWNER"
            role="tab"
            aria-selected="false"
          >
            <i class="ti ti-building-store" aria-hidden="true"></i>
            <span>사장</span>
          </button>
        </div>
        <div class="role-modal-actions">
          <a id="roleModalKakao" class="role-modal-kakao" href="#">
            <span class="role-modal-kakao-icon" aria-hidden="true">
              <svg class="kakao-logo" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M12 3c5.523 0 10 3.582 10 8 0 2.558-1.294 4.832-3.333 6.274L19 22l-5.2-2.86C14.89 19.378 13.47 19.5 12 19.5 6.477 19.5 2 15.918 2 11.5 2 7.082 6.477 3.5 12 3.5z"
                />
              </svg>
            </span>
            카카오로 계속하기
          </a>
          <p class="role-modal-divider" aria-hidden="true"><span>또는</span></p>
          <a id="roleModalEmailLogin" class="role-modal-secondary" href="/pages/auth/login.html?role=CUSTOMER"
            >이메일로 로그인</a
          >
          <a
            id="roleModalEmailRegister"
            class="role-modal-secondary"
            href="/pages/auth/register.html?role=CUSTOMER"
            >이메일로 회원가입</a
          >
        </div>
      </div>
    </div>

    <main class="site-main">
      <section id="panelNearby">
        <div class="page-heading">
          <p id="nearbyCount" class="page-heading-radar">위치를 알려주세요</p>
        </div>

        <div id="tasteFilterBar" class="taste-filter-bar" hidden>
          <p class="taste-filter-label">입맛 레이더</p>
          <div class="filter-row taste-filter-chips" id="tasteFilterChips">
            <button type="button" class="filter-pill taste-chip" data-taste="sweetness">단맛</button>
            <button type="button" class="filter-pill taste-chip" data-taste="saltiness">짠맛</button>
            <button type="button" class="filter-pill taste-chip" data-taste="sourness">신맛</button>
            <button type="button" class="filter-pill taste-chip" data-taste="bitterness">쓴맛</button>
            <button type="button" class="filter-pill taste-chip" data-taste="umami">감칠맛</button>
          </div>
        </div>

        <div class="nearby-toolbar">
          <button
            type="button"
            id="btnUseMyLocation"
            class="btn-primary btn-sm"
          >
            <i class="ti ti-current-location" aria-hidden="true"></i>
            내 위치로 검색
          </button>
          <label class="nearby-radius">
            반경
            <select id="nearbyRadius">
              <option value="1">1km</option>
              <option value="3" selected>3km</option>
              <option value="5">5km</option>
              <option value="10">10km</option>
            </select>
          </label>
        </div>

        <div id="mapContainer" class="map-container" aria-label="카카오 지도">
          <div id="mapPlaceholder" class="map-placeholder">
            <i class="ti ti-map" aria-hidden="true"></i>
            <p>위치 검색을 시작하면 지도가 표시됩니다.</p>
          </div>
        </div>

        <ul id="nearbyList" class="store-grid"></ul>
        <p id="nearbyEmpty" class="store-status-message" hidden></p>
      </section>
    </main>

    <footer class="site-footer">© Taste Radar — 개인 프로젝트</footer>
  </body>
</html>
