<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taste Radar — 입맛대로 주문하는 배달</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.26.0/dist/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="/assets/css/index.css" />
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/index.js" defer></script>
  </head>
  <body>
    <header class="site-header" aria-label="상단">
      <div class="site-header-inner">
        <a class="brand" href="./index.html">Taste Radar</a>

        <form id="searchForm" class="search-form" role="search">
          <i class="ti ti-search" aria-hidden="true"></i>
          <label for="searchInput" class="visually-hidden">가게 또는 메뉴 검색</label>
          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="가게 또는 메뉴를 검색해 보세요"
            autocomplete="off"
          />
          <button type="submit" class="search-submit">검색</button>
        </form>

        <div class="header-actions">
          <button
            id="btnKakaoLogin"
            type="button"
            class="btn-kakao"
            aria-label="카카오 로그인"
            aria-haspopup="dialog"
            hidden
          >
            <i class="ti ti-brand-kakao-talk" style="font-size: 18px"></i>
            <span>카카오 로그인</span>
          </button>
          <div id="userMenu" class="user-menu" hidden>
            <span class="user-nickname" id="userNickname"></span>
            <button type="button" id="btnLogout" class="btn-ghost-sm">로그아웃</button>
          </div>
        </div>
      </div>
    </header>

    <div
      id="roleModal"
      class="modal-backdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="roleModalTitle"
      aria-describedby="roleModalLead"
      hidden
    >
      <div class="modal-card">
        <button
          type="button"
          id="roleModalClose"
          class="modal-close"
          aria-label="닫기"
        >
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
        <h2 id="roleModalTitle" class="modal-title">어떤 모드로 시작할까요?</h2>
        <p id="roleModalLead" class="modal-lead">
          선택한 모드는 첫 가입 시 한 번만 적용됩니다.
        </p>
        <div class="role-options">
          <a
            class="role-card"
            href="http://localhost:8080/api/auth/kakao/start?role=CUSTOMER"
          >
            <i class="ti ti-shopping-bag role-icon" aria-hidden="true"></i>
            <strong class="role-title">고객으로 시작</strong>
            <span class="role-desc">입맛에 맞는 가게를 찾아 주문해요</span>
          </a>
          <a
            class="role-card"
            href="http://localhost:8080/api/auth/kakao/start?role=OWNER"
          >
            <i class="ti ti-building-store role-icon" aria-hidden="true"></i>
            <strong class="role-title">사장으로 시작</strong>
            <span class="role-desc">가게·메뉴·주문을 관리해요</span>
          </a>
        </div>
      </div>
    </div>

    <main class="site-main">
      <div class="page-heading">
        <h1 id="pageHeadingTitle">내 주변 인기 가게</h1>
        <span id="storeCount" class="page-heading-count">불러오는 중…</span>
      </div>
      <p class="page-lead">내 입맛에 꼭 맞는 가게를 둘러보세요.</p>

      <ul id="storeGrid" class="store-grid" aria-busy="true"></ul>
      <p id="storeStatus" class="store-status-message" hidden></p>

      <nav id="pagination" class="pagination" aria-label="페이지 이동" hidden>
        <button type="button" class="page-btn" id="pagePrev">이전</button>
        <span class="page-info" id="pageInfo">1 / 1</span>
        <button type="button" class="page-btn" id="pageNext">다음</button>
      </nav>
    </main>

    <footer class="site-footer">© Taste Radar — 개인 프로젝트</footer>
  </body>
</html>
