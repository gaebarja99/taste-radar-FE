<!DOCTYPE html>
<html lang="ko" class="taste-onboarding-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>입맛 선택 — Taste Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/tabler-icons.min.css" />
    <link rel="stylesheet" href="/assets/css/owner-order-manage.css" />
    <link rel="stylesheet" href="/assets/css/owner-pages.css" />
    <link rel="stylesheet" href="/assets/css/kakao-auth.css" />
    <link rel="stylesheet" href="/assets/css/store-pages.css" />
    <link rel="stylesheet" href="/assets/css/review-pages.css" />
    <link rel="stylesheet" href="/assets/css/customer-drawer.css" />
    <link rel="stylesheet" href="/assets/css/taste-onboarding.css" />
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/customer-notifications.js" defer></script>
    <script src="/assets/js/customer-menu.js" defer></script>
    <script src="/assets/js/review-shared.js" defer></script>
    <script src="/assets/js/taste-onboarding-page.js" defer></script>
  </head>
  <body>
    <header class="topbar" aria-label="상단 바">
      <div class="topbar-inner">
        <a class="topbar-brand" href="/">Taste Radar</a>
        <div class="store-topbar-actions header-actions">
          <button type="button" id="btnKakaoLogin" class="btn-kakao" hidden>
            <svg class="kakao-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3c5.523 0 10 3.582 10 8 0 2.558-1.294 4.832-3.333 6.274L19 22l-5.2-2.86C14.89 19.378 13.47 19.5 12 19.5 6.477 19.5 2 15.918 2 11.5 2 7.082 6.477 3.5 12 3.5z"/></svg>
            <span>카카오 로그인</span>
          </button>
          <span id="userNickname" class="store-user-nickname" hidden></span>
          <a class="store-icon-btn" href="/pages/cart.html" aria-label="장바구니">
            <i class="ti ti-shopping-cart" aria-hidden="true"></i>
            <span id="cartBadge" class="icon-badge" hidden>0</span>
          </a>
          <button
            type="button"
            id="btnMenu"
            class="store-icon-btn"
            aria-label="메뉴 열기"
            aria-haspopup="dialog"
            aria-controls="menuDrawer"
          >
            <i class="ti ti-menu-2" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </header>

    <aside
      id="menuDrawer"
      class="side-drawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="menuDrawerTitle"
      aria-hidden="true"
      hidden
    >
      <div class="drawer-backdrop" data-drawer-close></div>
      <div class="drawer-panel">
        <header class="drawer-head">
          <h2 id="menuDrawerTitle" class="drawer-title">메뉴</h2>
          <button type="button" class="drawer-close" data-drawer-close aria-label="닫기">
            <i class="ti ti-x" aria-hidden="true"></i>
          </button>
        </header>
        <nav class="drawer-body">
          <ul id="menuDrawerList" class="drawer-list"></ul>
        </nav>
        <footer id="menuDrawerFoot" class="drawer-foot" hidden></footer>
      </div>
    </aside>

    <div class="store-page">
      <main class="store-page-main">
        <header class="cart-page-head">
          <h1 class="cart-page-title">선호하는 입맛</h1>
          <p class="cart-page-store muted">한 가지 이상 골라 주세요. 나중에 다시 바꿀 수 있어요.</p>
          <p id="tastePickCount" class="taste-pick-count taste-pick-count--empty" aria-live="polite">
            아직 선택하지 않았어요
          </p>
        </header>
        <section class="table-section taste-onboarding-section">
          <form id="tasteForm" class="taste-onboarding-pills">
            <label class="taste-pill">
              <input type="checkbox" name="sweet" class="taste-pill-input" />
              <span class="taste-pill-text">단맛</span>
            </label>
            <label class="taste-pill">
              <input type="checkbox" name="salty" class="taste-pill-input" />
              <span class="taste-pill-text">짠맛</span>
            </label>
            <label class="taste-pill">
              <input type="checkbox" name="sour" class="taste-pill-input" />
              <span class="taste-pill-text">신맛</span>
            </label>
            <label class="taste-pill">
              <input type="checkbox" name="bitter" class="taste-pill-input" />
              <span class="taste-pill-text">쓴맛</span>
            </label>
            <label class="taste-pill">
              <input type="checkbox" name="umami" class="taste-pill-input" />
              <span class="taste-pill-text">감칠맛</span>
            </label>
          </form>
          <div class="taste-onboarding-actions">
            <button type="button" id="btnSaveTaste" class="btn-primary taste-onboarding-btn-save">저장하고 시작하기</button>
            <div class="taste-onboarding-bottom">
              <a href="/" class="taste-onboarding-skip">나중에</a>
              <div class="taste-onboarding-notice" role="note">
                <i class="ti ti-info-circle taste-onboarding-notice-icon" aria-hidden="true"></i>
                <p class="taste-onboarding-notice-text">
                  나중에 건너뛰면 AI 맞춤 추천을 받을 수 없어요. 입맛 설정에서 언제든 바꿀 수 있어요.
                </p>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
