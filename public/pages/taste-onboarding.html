<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>입맛 선택 — Taste Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.26.0/dist/tabler-icons.min.css" />
    <link rel="stylesheet" href="/assets/css/owner-order-manage.css" />
    <link rel="stylesheet" href="/assets/css/owner-pages.css" />
    <link rel="stylesheet" href="/assets/css/store-pages.css" />
    <link rel="stylesheet" href="/assets/css/review-pages.css" />
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/review-shared.js" defer></script>
    <script src="/assets/js/taste-onboarding-page.js" defer></script>
  </head>
  <body>
    <header class="topbar" aria-label="상단 바">
      <div class="topbar-inner">
      <a class="topbar-brand" href="/">Taste Radar</a>
      </div>
    </header>
    <div class="store-page">
      <main class="store-page-main" style="max-width:480px;margin:0 auto">
        <header class="cart-page-head">
          <h1 class="cart-page-title">선호하는 입맛</h1>
          <p class="cart-page-store muted">한 가지 이상 골라 주세요. 나중에 다시 바꿀 수 있어요.</p>
        </header>
        <section class="table-section" style="padding:18px">
          <form id="tasteForm" class="taste-pick-grid">
            <label class="taste-pick-item"><input type="checkbox" name="sweet" /> 단맛</label>
            <label class="taste-pick-item"><input type="checkbox" name="salty" /> 짠맛</label>
            <label class="taste-pick-item"><input type="checkbox" name="sour" /> 신맛</label>
            <label class="taste-pick-item"><input type="checkbox" name="bitter" /> 쓴맛</label>
            <label class="taste-pick-item"><input type="checkbox" name="umami" /> 감칠맛</label>
          </form>
          <div class="review-form-actions">
            <button type="button" id="btnSaveTaste" class="btn-primary" style="flex:1">저장하고 시작하기</button>
            <a href="/" class="btn-outline-sm" style="display:inline-flex;align-items:center;text-decoration:none">나중에</a>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
