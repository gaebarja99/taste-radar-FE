<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가게 관리 — Taste Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.26.0/dist/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="/assets/css/owner-order-manage.css" />
    <link rel="stylesheet" href="/assets/css/owner-pages.css" />
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/owner-shared.js" defer></script>
    <script src="/assets/js/owner-store-manage.js" defer></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="사이드 메뉴">
        <div class="sidebar-group" data-collapsed="false">
          <div class="sidebar-group-label">불러오는 중…</div>
        </div>
      </aside>

      <div class="main">
        <header class="page-header">
          <h1 class="page-title">가게 관리</h1>
          <div class="page-header-actions">
            <button type="button" class="btn-icon" id="btnRefresh" title="새로고침" aria-label="새로고침">
              <i class="ti ti-refresh" style="font-size: 18px"></i>
            </button>
          </div>
        </header>

        <section class="table-section" aria-labelledby="myStoresTitle">
          <div class="section-head">
            <h2 id="myStoresTitle" class="section-head-title">내 가게 목록</h2>
          </div>
          <div id="storeStack" class="card-stack" style="padding: 16px"></div>
          <p id="storeEmpty" class="empty-state" hidden>등록된 가게가 없어요. 아래에서 새 가게를 등록해 주세요.</p>
        </section>

        <section class="table-section" aria-labelledby="newStoreTitle">
          <div class="section-head">
            <h2 id="newStoreTitle" class="section-head-title">새 가게 등록</h2>
          </div>
          <form id="newStoreForm" class="form-grid" style="padding: 16px" novalidate>
            <label>
              가게명
              <input type="text" name="name" placeholder="예: 맛집 1호점" required />
            </label>
            <label>
              최소 주문 금액
              <input type="number" name="minOrderAmount" min="0" placeholder="10000" required />
            </label>
            <label class="col-span-2">
              주소
              <input type="text" name="address" placeholder="서울특별시 …" required />
            </label>
            <label class="col-span-2">
              상세 주소
              <input type="text" name="addressDetail" placeholder="101호" required />
            </label>
            <label>
              오픈 시간
              <input type="time" name="openTime" value="10:00" required />
            </label>
            <label>
              마감 시간
              <input type="time" name="closeTime" value="22:00" required />
            </label>
            <label>
              평균 조리 시간(분)
              <input type="number" name="requiredTimeMinutes" min="1" placeholder="30" required />
            </label>
            <label>
              대표 이미지 URL
              <input type="url" name="imgUrl" placeholder="https://…" required />
            </label>
            <label>
              위도(선택)
              <input type="number" name="latitude" step="any" placeholder="37.49" />
            </label>
            <label>
              경도(선택)
              <input type="number" name="longitude" step="any" placeholder="126.72" />
            </label>
            <div class="col-span-2 btn-row" style="justify-content: flex-end">
              <button type="submit" class="btn-primary" style="width: auto; padding: 0 24px">
                가게 등록
              </button>
            </div>
            <p id="newStoreMsg" class="empty-state" hidden style="grid-column: 1 / -1; margin: 0"></p>
          </form>
        </section>
      </div>
    </div>
  </body>
</html>
