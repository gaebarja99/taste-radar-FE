<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가게 관리 — Taste Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="/assets/css/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="/assets/css/owner-order-manage.css" />
    <link rel="stylesheet" href="/assets/css/owner-pages.css" />
    <!-- 다음 우편번호 서비스 (인증 키 불필요) -->
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/owner-shared.js" defer></script>
    <script src="/assets/js/owner-store-manage.js" defer></script>
  </head>
  <body>
    <header class="topbar" aria-label="상단 바">
      <div class="topbar-inner">
      <a class="topbar-brand" href="./owner-main.html">
        Taste Radar
        <span class="topbar-brand-tag">사장용</span>
      </a>
      <a class="topbar-menu" href="/index.html" title="메인으로" aria-label="메인으로 이동">
        <i class="ti ti-home" aria-hidden="true"></i>
      </a>
      </div>
    </header>

    <div class="app">
      <aside class="sidebar" aria-label="사이드 메뉴">
        <div class="sidebar-group" data-collapsed="false">
          <div class="sidebar-group-label">불러오는 중…</div>
        </div>
      </aside>

      <div class="main">
        <header class="page-header">
          <h1 class="page-title">가게 관리</h1>
          <div class="page-header-actions">
            <button type="button" class="btn-outline-sm" id="btnCreateStore">
              <i class="ti ti-plus" aria-hidden="true"></i> 가게 등록
            </button>
            <button type="button" class="btn-icon" id="btnRefresh" title="새로고침" aria-label="새로고침">
              <i class="ti ti-refresh" style="font-size: 18px"></i>
            </button>
          </div>
        </header>

        <section class="table-section" aria-labelledby="myStoresTitle">
          <div class="section-head">
            <h2 id="myStoresTitle" class="section-head-title">내 가게</h2>
          </div>
          <div id="storeStack" class="card-stack store-detail-stack" style="padding: 12px"></div>
          <p id="storeEmpty" class="empty-state" hidden>등록된 가게가 없어요.</p>
        </section>
      </div>
    </div>
  </body>
</html>
