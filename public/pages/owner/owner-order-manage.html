<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주문 관리 — Taste Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="/assets/css/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="/assets/css/owner-order-manage.css" />
    <link rel="stylesheet" href="/assets/css/owner-pages.css" />
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/owner-shared.js" defer></script>
    <script src="/assets/js/owner-order-manage.js" defer></script>
  </head>
  <body>
    <header class="topbar" aria-label="상단 바">
      <div class="topbar-inner">
      <a class="topbar-brand" href="./owner-main.html">
        Taste Radar
        <span class="topbar-brand-tag">사장용</span>
      </a>
      <a class="topbar-menu" href="/index.html" title="메인으로" aria-label="메인으로 이동">
        <i class="ti ti-home" aria-hidden="true"></i>
      </a>
      </div>
    </header>

    <div class="app">
      <aside class="sidebar" aria-label="사이드 메뉴">
        <div class="sidebar-group" data-collapsed="false">
          <div class="sidebar-group-label">불러오는 중…</div>
        </div>
      </aside>

      <div class="main">
        <header class="page-header">
          <h1 class="page-title">오늘의 주문 요약</h1>
          <div class="page-header-actions">
            <span class="date-pill" id="todayDate">-</span>
            <button type="button" class="btn-icon" id="btnRefresh" title="새로고침" aria-label="새로고침">
              <i class="ti ti-refresh" style="font-size: 18px"></i>
            </button>
          </div>
        </header>

        <div class="summary-grid" id="summaryCards" aria-label="주문 상태 요약">
          <article class="summary-card" data-summary="pending">
            <div class="summary-card-icon summary-card-icon--new"><i class="ti ti-bell-ringing"></i></div>
            <div class="summary-card-body">
              <p class="summary-card-label">신규 주문</p>
              <p class="summary-card-value" id="cntPending">—</p>
              <p class="summary-card-hint">PENDING · 수락 대기</p>
            </div>
          </article>
          <article class="summary-card" data-summary="cooking">
            <div class="summary-card-icon summary-card-icon--cooking"><i class="ti ti-tools-kitchen-2"></i></div>
            <div class="summary-card-body">
              <p class="summary-card-label">조리중</p>
              <p class="summary-card-value" id="cntCooking">—</p>
              <p class="summary-card-hint">COOKING</p>
            </div>
          </article>
          <article class="summary-card" data-summary="delivering">
            <div class="summary-card-icon summary-card-icon--delivering"><i class="ti ti-truck-delivery"></i></div>
            <div class="summary-card-body">
              <p class="summary-card-label">배달중</p>
              <p class="summary-card-value" id="cntDelivering">—</p>
              <p class="summary-card-hint">DELIVERING</p>
            </div>
          </article>
          <article class="summary-card" data-summary="delivered">
            <div class="summary-card-icon summary-card-icon--done"><i class="ti ti-circle-check"></i></div>
            <div class="summary-card-body">
              <p class="summary-card-label">완료</p>
              <p class="summary-card-value" id="cntDelivered">—</p>
              <p class="summary-card-hint">DELIVERED</p>
            </div>
          </article>
        </div>

        <div class="content-row">
          <section class="table-section" aria-labelledby="tableSectionTitle">
            <div class="section-head">
              <h2 id="tableSectionTitle" class="section-head-title">주문 목록</h2>
            </div>
            <div class="table-toolbar">
              <span class="table-total" id="orderTotalLabel">총 0건</span>
              <label class="visually-hidden" for="statusFilter">상태 필터</label>
              <select class="select-filter" id="statusFilter" aria-label="주문 상태 필터">
                <option value="">전체 상태</option>
                <option value="PENDING">신규(PENDING)</option>
                <option value="COOKING">조리 중(COOKING)</option>
                <option value="DELIVERING">배달 중(DELIVERING)</option>
                <option value="DELIVERED">배달 완료(DELIVERED)</option>
                <option value="REJECTED">주문 거절(REJECTED)</option>
              </select>
            </div>
            <div class="table-scroll">
              <table class="order-table">
                <thead>
                  <tr>
                    <th>주문 ID</th>
                    <th>총 가격</th>
                    <th>주문 시간</th>
                    <th>상태</th>
                    <th style="text-align:right">액션</th>
                  </tr>
                </thead>
                <tbody id="orderTableBody"></tbody>
              </table>
            </div>
            <div id="pagination" class="btn-row" style="justify-content:center;padding:8px 16px 16px"></div>
          </section>

          <aside class="cancel-panel" aria-labelledby="actionTitle">
            <div>
              <h2 id="actionTitle">주문 조회 · 거절</h2>
            </div>
            <div>
              <label class="field-label" for="orderIdInput">주문 ID</label>
              <input
                class="field-select"
                id="orderIdInput"
                style="height:36px;padding:0 12px"
              />
            </div>
            <div class="btn-row">
              <button type="button" class="btn-outline-sm" id="btnLookup">조회</button>
            </div>

            <div id="orderInfo" class="empty-state" hidden style="text-align:left;margin:0"></div>

            <div id="rejectBlock" hidden>
              <label class="field-label" for="rejectReason">거절 사유</label>
              <textarea
                class="field-textarea"
                id="rejectReason"
                placeholder="예: 재료 소진, 영업 종료 시간 임박 등"
              ></textarea>
              <div class="btn-row" style="margin-top:8px">
                <button type="button" class="btn-outline-sm is-danger" id="btnReject" disabled>주문 거절</button>
              </div>
              <p class="card-note" id="rejectHint" style="margin:6px 0 0">주문 ID와 사유를 입력하면 거절할 수 있어요.</p>
            </div>

            <p class="cancel-warning">
              <i class="ti ti-info-circle" style="font-size:14px;flex-shrink:0"></i>
              상태 변경 후에는 되돌릴 수 없습니다.
            </p>
          </aside>
        </div>
      </div>
    </div>
  </body>
</html>
