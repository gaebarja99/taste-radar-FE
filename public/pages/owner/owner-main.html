<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사장 메인 — Taste Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.26.0/dist/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="/assets/css/owner-main.css" />
    <link rel="stylesheet" href="/assets/css/owner-pages.css" />
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/owner-shared.js" defer></script>
    <script src="/assets/js/owner-main.js" defer></script>
  </head>
  <body>
    <header class="topbar" aria-label="상단 바">
      <a class="topbar-brand" href="./owner-main.html">Taste Radar</a>
      <a class="topbar-menu" href="/" title="메인으로" aria-label="메인으로 이동">
        <i class="ti ti-home" style="font-size: 20px"></i>
      </a>
    </header>

    <div class="app">
      <aside class="sidebar" aria-label="사이드 메뉴">
        <div class="sidebar-group" data-collapsed="false">
          <div class="sidebar-group-label">불러오는 중…</div>
        </div>
      </aside>

      <main class="main">
        <section class="card" aria-labelledby="todayOrdersTitle">
          <header class="card-header">
            <h1 id="todayOrdersTitle" class="card-title">오늘의 주문</h1>
            <p id="todaySummaryTotal" class="card-subtitle">불러오는 중…</p>
          </header>
          <ul id="storeBreakdownList" class="order-summary-list">
            <li>
              <span class="order-summary-label">불러오는 중…</span>
              <span class="order-summary-count">—</span>
            </li>
          </ul>
          <p class="card-note">* 가게별 오늘 주문 합계입니다. 상세 상태별 통계는 백엔드 미지원.</p>
        </section>

        <aside class="card store-status-card" aria-labelledby="storeStatusTitle">
          <h2 id="storeStatusTitle" class="card-title">영업 상태</h2>
          <div id="storeStatusList" style="display:flex;flex-direction:column;gap:14px">
            <p class="empty-state" style="margin:0">불러오는 중…</p>
          </div>
        </aside>
      </main>
    </div>
  </body>
</html>
