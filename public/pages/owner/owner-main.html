<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사장 메인 — Taste Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="/assets/css/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="/assets/css/owner-main.css" />
    <link rel="stylesheet" href="/assets/css/owner-pages.css" />
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/owner-shared.js" defer></script>
    <script src="/assets/js/owner-main.js" defer></script>
  </head>
  <body>
    <header class="topbar" aria-label="상단 바">
      <div class="topbar-inner">
      <a class="topbar-brand" href="./owner-main.html">
        Taste Radar
        <span class="topbar-brand-tag">사장용</span>
      </a>
      <a class="topbar-menu" href="/index.html" title="메인으로" aria-label="메인으로 이동">
        <i class="ti ti-home" aria-hidden="true"></i>
      </a>
      </div>
    </header>

    <div class="app app--dashboard">
      <main class="main dashboard-grid" aria-label="사장 대시보드">
        <article class="card dashboard-sales-card" aria-labelledby="weeklySalesTitle">
          <header class="card-header">
            <div>
              <h2 id="weeklySalesTitle" class="card-title">이번 주 매출</h2>
              <p id="weeklySalesChange" class="card-subtitle dashboard-change">불러오는 중…</p>
            </div>
            <p id="weeklySalesTotal" class="dashboard-metric-value">—</p>
          </header>
          <div
            id="weeklySalesChart"
            class="weekly-sales-chart"
            role="img"
            aria-label="이번 주 일별 매출 차트"
          >
            <p class="weekly-sales-chart-loading">불러오는 중…</p>
          </div>
        </article>

        <article class="card dashboard-rating-card" aria-labelledby="ratingSummaryTitle">
          <h2 id="ratingSummaryTitle" class="card-title">평균 별점</h2>
          <div class="dashboard-rating-head">
            <p id="ratingSummaryValue" class="dashboard-rating-value" aria-live="polite">—</p>
            <div id="ratingSummaryStars" class="dashboard-rating-stars" aria-hidden="true"></div>
            <p id="ratingSummaryMeta" class="dashboard-rating-meta">불러오는 중…</p>
          </div>
          <div class="rating-distribution" aria-labelledby="ratingDistTitle">
            <p id="ratingDistTitle" class="rating-distribution-title">별점 분포</p>
            <div id="ratingDistribution" class="rating-distribution-bars">
              <p class="rating-distribution-loading">불러오는 중…</p>
            </div>
          </div>
        </article>

        <section class="card today-orders-card" aria-labelledby="todayOrdersTitle">
          <header class="card-header today-orders-header">
            <div>
              <h2 id="todayOrdersTitle" class="card-title">오늘의 주문</h2>
              <p id="todayOrdersMeta" class="today-orders-meta">전체 가게 · 오늘 00:00~현재</p>
            </div>
            <p id="todayOrdersTotal" class="today-orders-total" aria-live="polite">—</p>
          </header>
          <ul id="storeBreakdownList" class="order-summary-list today-orders-list">
            <li>
              <span class="order-summary-label">불러오는 중…</span>
              <span class="order-summary-count">—</span>
            </li>
          </ul>
        </section>

        <aside class="card store-status-card" aria-labelledby="storeStatusTitle">
          <h2 id="storeStatusTitle" class="card-title">영업 상태</h2>
          <div id="storeStatusList" class="store-status-scroll">
            <p class="empty-state" style="margin:0">불러오는 중…</p>
          </div>
        </aside>
      </main>
    </div>
  </body>
</html>
